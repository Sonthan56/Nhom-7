<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Giới Thiệu - Nguyễn Hoài Nam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #090d16;
            --card-bg: #111827;
            --accent-cyan: #06b6d4;
            --accent-purple: #a855f7;
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.12) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(6, 182, 212, 0.15);
            overflow: hidden;
            position: relative;
        }

        /* Thanh viền Neon trang trí phía trên */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
        }

        .header {
            padding: 40px 20px 20px;
            text-align: center;
        }

        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-cyan);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.6);
            border-color: var(--accent-purple);
        }

        .header h1 {
            font-size: 2.1rem;
            margin-top: 16px;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        .content {
            padding: 30px;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 26px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title:first-child {
            margin-top: 0;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
        }

        .info-item {
            background: #1f2937;
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .info-item:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.2);
            transform: translateY(-2px);
        }

        .info-item label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        .info-item span {
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* Skills Progress Bar */
        .skill-item {
            margin-bottom: 12px;
        }

        .skill-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #1f2937;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }

        /* List */
        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #1f2937;
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        li i {
            color: var(--accent-cyan);
            font-size: 0.8rem;
        }

        /* Social Links */
        .social-links {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .social-btn {
            flex: 1;
            text-decoration: none;
            color: var(--text-main);
            background: #1f2937;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
