<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Giới Thiệu Thông Tin Cá Nhân - Nguyễn Hoài Nam</title>
    <!-- FontAwesome Font Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --subtext: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .header {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05) rotate(2deg);
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 4px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .content {
            padding: 30px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 6px;
            margin-top: 24px;
            margin-bottom: 12px;
        }

        .section-title:first-child {
            margin-top: 0;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .info-item {
            background: #f1f5f9;
            padding: 10px 14px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .info-item:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }

        .info-item label {
            display: block;
            font-size: 0.8rem;
            color: var(--subtext);
        }

        .info-item span {
            font-weight: 600;
        }

        /* Skills Progress Bar */
        .skill-item {
            margin-bottom: 10px;
        }
        .skill-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background: var(--primary);
            border-radius: 4px;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin-bottom: 6px;
        }

        .social-links {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .social-btn {
            text-decoration: none;
            color: var(--primary);
            background: #eff6ff;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .social-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ảnh đại diện & Họ tên -->
        <div class="header">
            <img src="avarta.png" alt="Ảnh đại diện" class="avatar">
            <h1>NGUYỄN HOÀI NAM</h1>
            <p>Sinh viên CNTT</p>
        </div>

        <div class="content">
            <!-- Thông tin bắt buộc -->
            <div class="section-title">THÔNG TIN CÁ NHÂN</div>
            <div class="info-grid">
                <div class="info-item">
                    <label>Mã sinh viên</label>
                    <span>24107879</span>
                </div>
                <div class="info-item">
                    <label>Ngày sinh</label>
                    <span>26/05/2006</span>
                </div>
                <div class="info-item">
                    <label>Giới tính</label>
                    <span>Nam</span>
                </div>
            </div>

            <!-- Kỹ năng lập trình -->
            <div class="section-title">KỸ NĂNG</div>
            <div class="skill-item">
                <div class="skill-info"><span>HTML / CSS</span><span>75%</span></div>
                <div class="progress-bar"><div class="progress" style="width: 75%;"></div></div>
            </div>
            <div class="skill-item">
                <div class="skill-info"><span>Git / GitHub</span><span>80%</span></div>
                <div class="progress-bar"><div class="progress" style="width: 80%;"></div></div>
            </div>

            <!-- Sở thích & Sở trường -->
            <div class="section-title">SỞ THÍCH</div>
            <ul>
                <li>Chơi đá bóng và tập luyện thể thao</li>
            </ul>

            <div class="section-title">SỞ TRƯỜNG</div>
            <ul>
                <li>Tư duy logic và giải quyết vấn đề</li>
                <li>Khả năng làm việc nhóm tốt</li>
            </ul>

            <div class="section-title">KẾT NỐI</div>
            <div class="social-links">
                <a href="https://www.facebook.com/share/1EiWXaFYDC/" target="_blank" class="social-btn">
                    <i class="fa-brands fa-facebook"></i> Facebook
                </a>
                <a href="https://github.com/namhihihi0" target="_blank" class="social-btn">
                    <i class="fa-brands fa-github"></i> GitHub
                </a>
            </div>
        </div>
    </div>

</body>
</html>
